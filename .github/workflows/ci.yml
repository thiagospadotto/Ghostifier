name: CI - Validação de Build e Qualidade (Ghostifier)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js (v18)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Validar Tipagem TypeScript e Compilação (Build)
        run: npm run build --if-present

      - name: Testar Inicialização da API Express
        run: |
          node -e "
            const fs = require('fs');
            if (fs.existsSync('./server/data/alternatives.json')) {
              console.log('✓ Arquivo de persistência Local-First validado com sucesso!');
            } else {
              process.exit(1);
            }
          "

      - name: Validar Build dos Containers Docker (Nginx + Express)
        run: docker compose build